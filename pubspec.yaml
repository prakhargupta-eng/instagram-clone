name: instagram_clone
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  intl: ^0.20.2
  shared_preferences: ^2.3.0
  video_player: ^2.13.0
  image_picker: ^1.1.2
  photo_manager: ^3.6.0
  flutter_staggered_grid_view: ^0.7.0
  path_provider: ^2.1.4
  audioplayers: ^6.8.1
  cached_network_image: ^3.4.1
  path: ^1.9.0
  get_thumbnail_video: ^0.7.3
  flutter_cache_manager: ^3.4.1
  flutter_bloc: ^8.1.6
  skeletonizer: ^2.1.3
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  network_image_mock: ^2.1.0

flutter:
  uses-material-design: true

  assets:
    - lib/src/asserts/
    - assets/icons/

  shaders:
    - assets/shaders/retro.frag
